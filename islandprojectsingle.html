<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>The Island Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/AlexBoops/The-island-project@main/icons/icon-512.png">

    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }

      /* Force perfect viewport centering and prevent offset drift */
      canvas, .c3htmlwrap {
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        margin: 0 !important;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #top-bar {
        position: fixed;
        top: 10px;
        right: 14px;
        display: flex;
        gap: 8px;
        z-index: 100000;
        opacity: 0.85;
      }
      .hud-btn {
        background: rgba(18, 18, 18, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ddd;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        backdrop-filter: blur(4px);
        user-select: none;
      }
      .hud-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }
      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 20, 20, 0.9);
        border: 1px solid #444;
        color: #eee;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        display: none;
        z-index: 200000;
      }

      /* Loading Screen */
      #boot-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        z-index: 99999;
      }
      #boot-title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      #progress-box {
        width: 360px;
        max-width: 85vw;
        height: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        overflow: hidden;
        margin-top: 16px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      #progress-bar {
        width: 0%;
        height: 100%;
        background: #00bcd4;
        border-radius: 6px;
        transition: width 0.15s ease;
      }
      #boot-chunk {
        font-size: 13px;
        color: #eee;
        margin-top: 12px;
        max-width: 85vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: monospace;
      }
      #boot-details {
        font-size: 12px;
        color: #777;
        margin-top: 6px;
        font-family: monospace;
      }
    </style>

    <script>
      const CDN_BASE = "https://cdn.jsdelivr.net/gh/AlexBoops/The-island-project@main/";

      function resolveUrl(url) {
        if (!url || typeof url !== "string") return url;
        if (url.startsWith("blob:") || url.startsWith("data:") || url.startsWith(CDN_BASE)) {
          return url;
        }

        let clean = url;
        if (clean.includes("/media/")) {
          clean = "media/" + clean.split("/media/")[1];
        } else if (clean.includes("/images/")) {
          clean = "images/" + clean.split("/images/")[1];
        } else if (clean.includes("/scripts/")) {
          clean = "scripts/" + clean.split("/scripts/")[1];
        } else if (clean.includes("/icons/")) {
          clean = "icons/" + clean.split("/icons/")[1];
        } else if (/^https?:\/\//i.test(clean)) {
          clean = clean.split("/").pop();
        } else {
          clean = clean.replace(/^\/+/, "");
        }

        return CDN_BASE + clean;
      }

      window._c3Progress = {
        totalAssets: 90,
        loadedAssets: 0,
        bytesLoaded: 0,
        update: function(fileName, size = 0) {
          this.loadedAssets++;
          this.bytesLoaded += size;
          const chunkEl = document.getElementById("boot-chunk");
          const detailsEl = document.getElementById("boot-details");
          const barEl = document.getElementById("progress-bar");

          const pct = Math.min(95, Math.round((this.loadedAssets / this.totalAssets) * 100));
          const mb = (this.bytesLoaded / (1024 * 1024)).toFixed(1);

          if (chunkEl) chunkEl.textContent = "Loading: " + decodeURIComponent(fileName);
          if (detailsEl) detailsEl.textContent = `${mb} MB fetched (${pct}%)`;
          if (barEl) barEl.style.width = pct + "%";
        }
      };

      const nativeOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url) {
        const resolved = resolveUrl(url);
        this.addEventListener("load", function() {
          const name = resolved.substring(resolved.lastIndexOf("/") + 1) || "data";
          const len = parseInt(this.getResponseHeader("content-length") || "102400", 10);
          window._c3Progress.update(name, len);
        });
        arguments[1] = resolved;
        return nativeOpen.apply(this, arguments);
      };

      const nativeFetch = window.fetch.bind(window);
      window.fetch = function(input, init) {
        let url = typeof input === "string" ? input : (input && input.url ? input.url : "");
        const resolved = resolveUrl(url);

        return nativeFetch(typeof input === "string" ? resolved : new Request(resolved, input), init).then(res => {
          const name = resolved.substring(resolved.lastIndexOf("/") + 1) || "asset";
          const len = parseInt(res.headers.get("content-length") || "51200", 10);
          window._c3Progress.update(name, len);
          return res;
        });
      };

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register = () => Promise.reject(new Error("Disabled"));
      }
    </script>
</head>

<body>
    <div id="top-bar">
      <button class="hud-btn" id="ab-btn" title="Open cloaked in about:blank">About:Blank</button>
      <button class="hud-btn" id="fs-btn" title="Toggle Fullscreen">Fullscreen</button>
    </div>

    <div id="toast"></div>

    <div id="boot-overlay">
      <div id="boot-title">The Island Project</div>
      <div id="progress-box"><div id="progress-bar"></div></div>
      <div id="boot-chunk">Initializing game engine...</div>
      <div id="boot-details">0.0 MB fetched (0%)</div>
    </div>

    <script>
      function showToast(msg, duration = 3000) {
        const el = document.getElementById("toast");
        if (!el) return;
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => { el.style.display = "none"; }, duration);
      }

      const abBtn = document.getElementById("ab-btn");
      if (window.location.href === "about:blank" || window.origin === "null") {
        abBtn.style.display = "none";
      }

      abBtn.addEventListener("click", function() {
        try {
          const win = window.open("about:blank", "_blank");
          if (!win || win.closed) {
            showToast("Pop-up blocked! Please allow pop-ups for this site.");
            return;
          }
          abBtn.style.display = "none";
          const doc = win.document;
          doc.open();
          doc.write("<!DOCTYPE html>\n" + document.documentElement.outerHTML);
          doc.close();
        } catch (e) {
          showToast("Failed to open about:blank: " + e.message);
        }
      });

      document.getElementById("fs-btn").addEventListener("click", function() {
        if (!document.fullscreenElement) {
          (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
      });

      function hideLoader() {
        const bar = document.getElementById("progress-bar");
        const details = document.getElementById("boot-details");
        if (bar) bar.style.width = "100%";
        if (details) details.textContent = "Engine Ready (100%)";
        setTimeout(() => {
          const o = document.getElementById("boot-overlay");
          if (o) o.style.display = "none";
        }, 200);
      }

      window.addEventListener("c3_runtime_ready", hideLoader);

      const watchCanvas = setInterval(() => {
        const canvas = document.querySelector("canvas");
        if (canvas && canvas.style.display !== "none" && (window["c3_runtimeInterface"] || window["c3canvas"])) {
          clearInterval(watchCanvas);
          hideLoader();
        }
      }, 250);
    </script>

    <script src="https://cdn.jsdelivr.net/gh/AlexBoops/The-island-project@main/scripts/modernjscheck.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AlexBoops/The-island-project@main/scripts/supportcheck.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AlexBoops/The-island-project@main/scripts/offlineclient.js" type="module"></script>

    <!-- Force DOM Runner without worker locks -->
    <script type="module">
      const mainScriptUrl = CDN_BASE + "scripts/main.js";
      const resp = await fetch(mainScriptUrl);
      let code = await resp.text();

      code = code.replace(
        /window\["c3_runtimeInterface"\]\s*=\s*new self\.RuntimeInterface\([\s\S]*?\);?/,
        `window["c3_runtimeInterface"] = new self.RuntimeInterface({
          useWorker: false,
          runtimeScriptList: ["${CDN_BASE}scripts/c3runtime.js", "${CDN_BASE}scripts/c3main.js"],
          scriptFolder: "${CDN_BASE}scripts/",
          runtimeBaseUrl: "${CDN_BASE}",
          exportType: "instant-games"
        });`
      );

      const blob = new Blob([code], { type: "application/javascript" });
      await import(URL.createObjectURL(blob));
    </script>
</body>
</html>
