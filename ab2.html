<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AB2</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
      }

      .webgl-content {
        width: 100%;
        height: 100%;
        margin: 0;
        position: absolute;
        top: 0;
        left: 0;
        transform: none;
      }

      #gameContainer {
        width: 100% !important;
        height: 100% !important;
        position: absolute;
        top: 0;
        left: 0;
      }

      #gameContainer canvas {
        width: 100vw !important;
        height: 100vh !important;
        display: block;
        object-fit: fill !important;
      }

      #cloak-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1000;
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.65);
        color: #ddd;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 0.2s, color 0.2s;
      }

      #cloak-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }

      #loading-status {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: #888;
        font-size: 13px;
        letter-spacing: 1px;
        z-index: 10;
        pointer-events: none;
      }
    </style>

    <script>
      // Disable failing UnityCache IndexedDB implementation
      window.UnityCache = {
        isSupported: () => false,
        load: () => Promise.reject(),
        save: () => Promise.resolve()
      };
    </script>
  </head>

  <body>
    <button id="cloak-btn" title="Open in About:Blank">🌐 About:Blank</button>

    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>

    <div id="loading-status">INITIALIZING...</div>

    <script>
      // About:Blank Cloaker
      document.getElementById("cloak-btn").addEventListener("click", () => {
        const win = window.open("about:blank", "_blank");
        if (!win) {
          alert("Popup blocked! Allow popups to use the About:Blank cloaker.");
          return;
        }
        win.document.title = "Google Docs";
        const link = win.document.createElement("link");
        link.rel = "icon";
        link.href = "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico";
        win.document.head.appendChild(link);

        const iframe = win.document.createElement("iframe");
        iframe.style.position = "fixed";
        iframe.style.top = "0";
        iframe.style.left = "0";
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "none";
        iframe.src = window.location.href;
        win.document.body.style.margin = "0";
        win.document.body.style.overflow = "hidden";
        win.document.body.appendChild(iframe);

        window.location.replace("https://classroom.google.com");
      });

      (() => {
        const statusText = document.getElementById("loading-status");
        const CDN_BASE = "https://cdn.jsdelivr.net/gh/AlexBoops/ab2rip@main";
        const BUILD_URL = `${CDN_BASE}/Build`;
        const DATA_BASE_NAME = "AngryBirds2WebPortFinal.data.unityweb";
        const TOTAL_DATA_PARTS = 6;

        function updateStatus(msg) {
          if (statusText) statusText.textContent = msg;
        }

        function unlockAudio() {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            const ctx = new AudioContextClass();
            if (ctx.state === "suspended") ctx.resume();
          }
        }
        window.addEventListener("click", unlockAudio, { once: true });
        window.addEventListener("keydown", unlockAudio, { once: true });
        window.addEventListener("touchstart", unlockAudio, { once: true });

        function loadScript(src) {
          return new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = src;
            s.crossOrigin = "anonymous";
            s.onload = resolve;
            s.onerror = () => reject(new Error(`Failed to load ${src}`));
            document.head.appendChild(s);
          });
        }

        async function fetchChunkWithRetry(url, retries = 6, delayMs = 5000) {
          for (let attempt = 1; attempt <= retries; attempt++) {
            try {
              const res = await fetch(url);
              const contentType = res.headers.get("content-type") || "";
              if (res.ok && !contentType.includes("text/html")) {
                const buf = await res.arrayBuffer();
                if (buf.byteLength > 0) return buf;
              }
              console.warn(`[Attempt ${attempt}/${retries}] HTTP ${res ? res.status : "Error"} for ${url}`);
            } catch (e) {
              console.warn(`[Attempt ${attempt}/${retries}] Network error for ${url}`);
            }

            if (attempt < retries) {
              updateStatus(`RETRYING DATA CHUNK (ATTEMPT ${attempt}/${retries})...`);
              await new Promise(r => setTimeout(r, delayMs));
            }
          }
          throw new Error(`Failed to download ${url}`);
        }

        async function assembleSplitData() {
          const chunks = [];
          let totalLength = 0;

          for (let i = 1; i <= TOTAL_DATA_PARTS; i++) {
            const partNum = String(i).padStart(4, "0");
            const chunkUrl = `${BUILD_URL}/${DATA_BASE_NAME}.part${partNum}`;
            updateStatus(`DOWNLOADING GAME DATA (${i}/${TOTAL_DATA_PARTS})...`);

            const buf = await fetchChunkWithRetry(chunkUrl);
            chunks.push(buf);
            totalLength += buf.byteLength;
          }

          const combined = new Uint8Array(totalLength);
          let offset = 0;
          for (const chunk of chunks) {
            combined.set(new Uint8Array(chunk), offset);
            offset += chunk.byteLength;
          }

          return URL.createObjectURL(new Blob([combined], { type: "application/octet-stream" }));
        }

        function forceFill() {
          const c = document.querySelector("#gameContainer canvas");
          if (!c) return;
          const w = window.innerWidth;
          const h = window.innerHeight;
          c.width = w;
          c.height = h;
          c.style.setProperty("width", "100vw", "important");
          c.style.setProperty("height", "100vh", "important");
        }
        window.addEventListener("resize", forceFill);
        setInterval(forceFill, 250);

        async function boot() {
          try {
            updateStatus("LOADING PATCH SCRIPTS...");

            // 1. Load the original StreamingAssetsFix.js & c.js
            try {
              await loadScript(`${CDN_BASE}/StreamingAssetsFix.js`);
            } catch (e) {
              console.warn("StreamingAssetsFix.js not found at CDN root, continuing...");
            }

            try {
              await loadScript(`${CDN_BASE}/c.js`);
            } catch (e) {
              console.warn("c.js not found at CDN root, continuing...");
            }

            // 2. Download and assemble all 6 data parts into an octet Blob URL
            const dataBlobUrl = await assembleSplitData();

            // 3. Synthesize inline JSON configuration with 512MB (8192 pages) memory
            const configObj = {
              TOTAL_MEMORY: 536870912,
              dataUrl: dataBlobUrl,
              wasmCodeUrl: `${BUILD_URL}/AngryBirds2WebPortFinal.wasm.code.unityweb`,
              wasmFrameworkUrl: `${BUILD_URL}/AngryBirds2WebPortFinal.wasm.framework.unityweb`,
              graphicsAPI: ["WebGL 2.0", "WebGL 1.0"],
              webglContextAttributes: { preserveDrawingBuffer: false },
              splashScreenStyle: "Dark",
              backgroundColor: "#000000"
            };

            const jsonBlobUrl = URL.createObjectURL(
              new Blob([JSON.stringify(configObj)], { type: "application/json" })
            );

            // 4. Intercept XHR for engine requests
            const originalOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url, ...rest) {
              if (typeof url === "string") {
                if (url.includes(DATA_BASE_NAME)) {
                  url = dataBlobUrl;
                } else if (url.includes("AngryBirds2WebPortFinal.json")) {
                  url = jsonBlobUrl;
                } else if (!url.startsWith("http://") && !url.startsWith("https://") && !url.startsWith("blob:") && !url.startsWith("data:")) {
                  url = `${CDN_BASE}/${url.replace(/^\.?\//, "")}`;
                }
              }
              return originalOpen.call(this, method, url, ...rest);
            };

            updateStatus("LOADING ENGINE RUNTIME...");

            // 5. Load TemplateData scripts and UnityLoader.js
            try {
              await loadScript(`${CDN_BASE}/TemplateData/UnityProgress.js`);
            } catch (e) {}

            await loadScript(`${BUILD_URL}/UnityLoader.js`);

            updateStatus("STARTING ENGINE...");

            // 6. Instantiate using jsonBlobUrl and original onProgress handler
            window.gameInstance = UnityLoader.instantiate("gameContainer", jsonBlobUrl, {
              onProgress: function (g, p) {
                if (typeof UnityProgress === "function") {
                  UnityProgress(g, p);
                }
                updateStatus(p < 1 ? `LOADING ENGINE... ${Math.round(p * 100)}%` : "READY");
                forceFill();
                if (p === 1) {
                  if (statusText) statusText.style.display = "none";
                  const l = document.getElementById("unityLogo");
                  if (l) l.style.display = "none";
                }
              }
            });

          } catch (err) {
            console.error(err);
            updateStatus("LAUNCH ERROR: " + (err.message || err));
          }
        }

        boot();
      })();
    </script>
  </body>
</html>
